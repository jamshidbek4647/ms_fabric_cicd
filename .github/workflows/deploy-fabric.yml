name: Deploy to Fabric

on:
  push:
    branches: [main]

jobs:
  ci-validate:
    name: CI - Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install yamllint

      - run: yamllint --config-file devops/.yamllint.yml fabric_items/

      - run: python devops/ci_validate.py
  
  deploy-dev:
    name: Deploy to DEV
    runs-on: ubuntu-latest
    needs: ci-validate
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fabric-cicd azure-identity

      - name: Deploy to DEV
        run: python devops/deploy.py
        env:
          TARGET_ENV: dev
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEV_WORKSPACE_ID: ${{ vars.DEV_WORKSPACE_ID }}
          TEST_WORKSPACE_ID: ${{ vars.TEST_WORKSPACE_ID }}
          PROD_WORKSPACE_ID: ${{ vars.PROD_WORKSPACE_ID }}

  deploy-test:
    name: Deploy to TEST
    runs-on: ubuntu-latest
    needs: deploy-dev          # waits for DEV to pass
    environment: tst
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fabric-cicd azure-identity
      - name: Deploy to TEST
        run: python devops/deploy.py
        env:
          TARGET_ENV: tst
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEV_WORKSPACE_ID: ${{ vars.DEV_WORKSPACE_ID }}
          TEST_WORKSPACE_ID: ${{ vars.TEST_WORKSPACE_ID }}
          PROD_WORKSPACE_ID: ${{ vars.PROD_WORKSPACE_ID }}

  deploy-prod:
    name: Deploy to PROD
    runs-on: ubuntu-latest
    needs: deploy-test          # waits for TEST to pass
    environment: prd           # ← this triggers the approval gate you configured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fabric-cicd azure-identity
      - name: Deploy to PROD
        run: python devops/deploy.py
        env:
          TARGET_ENV: prd
          TENANT_ID: ${{ secrets.TENANT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          DEV_WORKSPACE_ID: ${{ vars.DEV_WORKSPACE_ID }}
          TEST_WORKSPACE_ID: ${{ vars.TEST_WORKSPACE_ID }}
          PROD_WORKSPACE_ID: ${{ vars.PROD_WORKSPACE_ID }}
